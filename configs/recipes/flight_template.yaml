version: 1

project:
  key: TEMPLATE_FLIGHT
  name: Flight Prediction Template
  description: "Configuration-created flight prediction project"
  tags: [template, flight, generated]

# This connection is intentionally external: choose a writable UploadedFiles
# connection already configured on your DSS instance.
connections: []

zones:
  - {name: Raw Data, color: "#4E79A7"}
  - {name: Model, color: "#F28E2B"}
  - {name: Training, color: "#59A14F"}
  - {name: Evaluation, color: "#E15759"}

sample_data:
  - name: flight_data
    generator: flight
    records: 100
    seed: 42
    filename: flight_data.csv

datasets:
  - name: flight_data
    kind: uploaded
    connection: dataiku-managed-storage
    external_connection: true
    generated_sample: flight_data
    zone: Raw Data
    schema_columns:
      - {name: flight_id, type: string}
      - {name: origin, type: string}
      - {name: destination, type: string}
      - {name: distance, type: bigint}
      - {name: air_time, type: bigint}
      - {name: delay, type: bigint}
      - {name: cancelled, type: bigint}
  - name: flight_data_prepared
    # Build outputs must be managed by DSS; external S3 paths cannot be
    # cleared by an overwrite Prepare build.
    kind: managed
    connection: dataiku-managed-storage
    external_connection: true
    zone: Model
  - name: predictions
    kind: managed
    connection: dataiku-managed-storage
    external_connection: true
    zone: Training
  - name: evaluation
    kind: managed
    connection: dataiku-managed-storage
    external_connection: true
    zone: Evaluation

folders:
  - name: models
    # The screenshot-confirmed storage connection on this DSS instance.
    connection: dataiku-managed-storage
    external_connection: true
    folder_type: S3
    storage_params:
      connection: dataiku-managed-storage
      path: "/managed-dss-data/${projectKey}/${odbId}"
    zone: Model

models:
  - generator: linear_regression
    folder: models
    destination: /linear_regression.pkl
    filename: linear_regression.pkl
    sample_data: flight_data
    features: [distance, delay, cancelled]
    target: air_time

recipes:
  - name: Prepare Recipe
    type: prepare
    zone: Model
    # Required by the DSS Prepare runner; use the built-in DSS engine so the
    # transformation steps can run against the uploaded dataset.
    params:
      engineType: DSS
    definition:
      inputs:
        main: {items: [{ref: flight_data}]}
      outputs:
        main: {items: [{ref: flight_data_prepared, appendMode: false}]}
    # These use the built-in Prepare processor format.  They make the
    # downstream training fields buildable when a source file contains blank
    # numerical values, while retaining every original column.
    payload:
      steps:
        - metaType: PROCESSOR
          type: FillEmptyWithValue
          params:
            columns: [distance]
            appliesTo: SINGLE_COLUMN
            value: "0"
        - metaType: PROCESSOR
          type: FillEmptyWithValue
          params:
            columns: [delay]
            appliesTo: SINGLE_COLUMN
            value: "0"
        - metaType: PROCESSOR
          type: FillEmptyWithValue
          params:
            columns: [cancelled]
            appliesTo: SINGLE_COLUMN
            value: "0"
        - metaType: PROCESSOR
          type: FillEmptyWithValue
          params:
            columns: [air_time]
            appliesTo: SINGLE_COLUMN
            value: "0"
  # DSS recipe identifiers must not contain dots. The source code remains in
  # recipes/predict.py; this is only the Flow object name.
  - name: predict
    type: python
    zone: Training
    code_template: recipes/predict.py
    definition:
      inputs:
        main: {items: [{ref: flight_data_prepared}]}
        model_folder: {items: [{ref: models}]}
      outputs:
        main: {items: [{ref: predictions, appendMode: false}]}
  - name: evaluate
    type: python
    zone: Evaluation
    code_template: recipes/evaluate.py
    definition:
      inputs:
        main: {items: [{ref: predictions}]}
      outputs:
        main: {items: [{ref: evaluation, appendMode: false}]}
