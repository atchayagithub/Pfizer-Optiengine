version: 1

project:
  key: EMPLOYEE_PREDICTION_TEMPLATE
  name: Employee Prediction Template
  description: "Employee salary prediction Flow created entirely from declarative configuration"
  tags: [template, employee, prediction, generated]

connections: []

zones:
  - {name: Raw Data, color: "#4E79A7"}
  - {name: Transformation, color: "#F28E2B"}
  - {name: Training, color: "#59A14F"}

sample_data:
  - {name: employees, generator: employees, records: 100, seed: 2026, filename: employees.csv}
  - {name: departments, generator: departments, records: 10, seed: 2026, filename: departments.csv}
  # This is the deterministic local equivalent of the Join output. It trains
  # the artifact before DSS builds the visual Flow; the Flow itself creates
  # dataset_merged using the Join recipe below.
  - {name: dataset_merged_training, generator: employee_merged, records: 100, seed: 2026, filename: dataset_merged_training.csv}

datasets:
  - name: employees
    kind: uploaded
    connection: dataiku-managed-storage
    external_connection: true
    generated_sample: employees
    zone: Raw Data
    schema_columns:
      - {name: employee_id, type: string}
      - {name: employee_name, type: string}
      - {name: age, type: bigint}
      - {name: gender, type: string}
      - {name: department_id, type: string}
      - {name: salary, type: double}
      - {name: experience, type: bigint}
      - {name: performance_score, type: double}
      - {name: education, type: string}
      - {name: city, type: string}
  - name: departments
    kind: uploaded
    connection: dataiku-managed-storage
    external_connection: true
    generated_sample: departments
    zone: Raw Data
    schema_columns:
      - {name: department_id, type: string}
      - {name: department_name, type: string}
      - {name: manager, type: string}
      - {name: location, type: string}
      - {name: budget, type: double}

  - name: employees_prepared
    kind: managed
    connection: dataiku-managed-storage
    external_connection: true
    zone: Transformation
    schema_columns:
      - {name: employee_id, type: string}
      - {name: employee_name, type: string}
      - {name: age, type: bigint}
      - {name: gender, type: string}
      - {name: department_id, type: string}
      - {name: salary, type: double}
      - {name: experience, type: bigint}
      - {name: performance_score, type: double}
      - {name: education, type: string}
      - {name: city, type: string}

  - name: departments_prepared
    kind: managed
    connection: dataiku-managed-storage
    external_connection: true
    zone: Transformation
    schema_columns:
      - {name: department_id, type: string}
      - {name: department_name, type: string}
      - {name: manager, type: string}
      - {name: location, type: string}
      - {name: budget, type: double}
      
  - name: dataset_merged
    kind: managed
    connection: dataiku-managed-storage
    external_connection: true
    zone: Transformation
    schema_columns:
      - {name: employee_id, type: string}
      - {name: employee_name, type: string}
      - {name: age, type: bigint}
      - {name: gender, type: string}
      - {name: department_id, type: string}
      - {name: salary, type: double}
      - {name: experience, type: bigint}
      - {name: performance_score, type: double}
      - {name: education, type: string}
      - {name: city, type: string}
      - {name: department_name, type: string}
      - {name: manager, type: string}
      - {name: location, type: string}
      - {name: budget, type: double}
  - {name: employee_predictions, kind: managed, connection: dataiku-managed-storage, external_connection: true, zone: Training}

folders:
  - name: models
    connection: dataiku-managed-storage
    external_connection: true
    folder_type: S3
    storage_params:
      connection: dataiku-managed-storage
      path: "/managed-dss-data/${projectKey}/${odbId}"
    zone: Training

models:
  - generator: linear_regression
    folder: models
    destination: /linear_regression.pkl
    filename: linear_regression.pkl
    sample_data: dataset_merged_training
    features: [age, experience, performance_score, budget]
    target: salary

recipes:
  - name: prepare_employees
    type: prepare
    zone: Transformation
    params: {engineType: DSS}
    definition:
      inputs: {main: {items: [{ref: employees}]}}
      outputs: {main: {items: [{ref: employees_prepared, appendMode: false}]}}
    payload:
      steps:
        # The generated names are already normalized. Do not use the optional
        # Trim plugin processor here: it is not installed on every DSS
        # instance and would prevent the recipe from validating.
        - {metaType: PROCESSOR, type: FillEmptyWithValue, params: {columns: [salary], appliesTo: SINGLE_COLUMN, value: "0"}}
        - {metaType: PROCESSOR, type: FillEmptyWithValue, params: {columns: [experience], appliesTo: SINGLE_COLUMN, value: "0"}}
        - {metaType: PROCESSOR, type: FillEmptyWithValue, params: {columns: [performance_score], appliesTo: SINGLE_COLUMN, value: "0"}}
  - name: prepare_departments
    type: prepare
    zone: Transformation
    params: {engineType: DSS}
    definition:
      inputs: {main: {items: [{ref: departments}]}}
      outputs: {main: {items: [{ref: departments_prepared, appendMode: false}]}}
    payload:
      steps:
        # Department names and locations are generated in normalized form.
        - {metaType: PROCESSOR, type: FillEmptyWithValue, params: {columns: [location], appliesTo: SINGLE_COLUMN, value: "Unknown"}}
        - {metaType: PROCESSOR, type: FillEmptyWithValue, params: {columns: [budget], appliesTo: SINGLE_COLUMN, value: "0"}}
  - name: join_employees_departments
    type: join
    zone: Transformation
    # Join recipes read the selected engine from their visual payload on DSS
    # 14; retain it in params too for raw-creation compatibility.
    params: {engineType: DSS}
    definition:
      inputs:
        main: {items: [{ref: employees_prepared}, {ref: departments_prepared}]}
      outputs:
        main: {items: [{ref: dataset_merged, appendMode: false}]}
    payload:
      engineType: DSS
      virtualInputs:
        - {index: 0}
        - {index: 1}
      joins:
        - table1: 0
          table2: 1
          type: LEFT
          outerJoinOnTheLeft: true
          conditionsMode: AND
          rightLimit: {decisionColumn: {}}
          "on":
            - type: EQ
              column1: {name: department_id, table: 0}
              column2: {name: department_id, table: 1}
      selectedColumns:
        - {name: employee_id, type: string, table: 0}
        - {name: employee_name, type: string, table: 0}
        - {name: age, type: bigint, table: 0}
        - {name: gender, type: string, table: 0}
        - {name: department_id, type: string, table: 0}
        - {name: salary, type: double, table: 0}
        - {name: experience, type: bigint, table: 0}
        - {name: performance_score, type: double, table: 0}
        - {name: education, type: string, table: 0}
        - {name: city, type: string, table: 0}
        - {name: department_name, type: string, table: 1}
        - {name: manager, type: string, table: 1}
        - {name: location, type: string, table: 1}
        - {name: budget, type: double, table: 1}
      computedColumns: []
  - name: predict_employee_salary
    type: python
    zone: Training
    code_template: recipes/predict_employee_salary.py
    definition:
      inputs:
        main: {items: [{ref: dataset_merged}]}
        model_folder: {items: [{ref: models}]}
      outputs:
        main: {items: [{ref: employee_predictions, appendMode: false}]}
